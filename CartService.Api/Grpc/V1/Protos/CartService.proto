syntax = "proto3";

package cart.v1;

option csharp_namespace = "CartService.Api.Grpc.V1.Protos";

service CartService {
	rpc AddCartItem(AddCartItemRequest) returns (CartResponse);

    rpc ChangeCartItemQuantity(ChangeCartItemQuantityRequest) returns (CartResponse);

    rpc ClearCart(ClearCartRequest) returns (CartResponse);

    rpc RemoveCartItem(RemoveCartItemRequest) returns (CartResponse);
    rpc RemoveUnavailableCartItems(RemoveUnavailableCartItemsRequest) returns (CartResponse);

    rpc GetCart(GetCartRequest) returns (CartResponse);
}

message AddCartItemRequest {
    string buyer_id = 1;
    string variant_id = 2;
    int32 quantity = 3;
}

message ChangeCartItemQuantityRequest {
    string buyer_id = 1;
    string variant_id = 2;
    int32 quantity = 3;
}

message ClearCartRequest {
    string buyer_id = 1;
}

message RemoveCartItemRequest {
    string buyer_id = 1;
    string variant_id = 2;
}

message RemoveUnavailableCartItemsRequest {
    string buyer_id = 1;
}

message GetCartRequest {
    string buyer_id = 1;
}

message CartResponse {
    string cart_id = 1;
    repeated CartItemResponse items = 2;
}

message CartItemResponse {
    string variant_id = 1;
    string product_id = 2;
    string vendor_id = 3;
    int32 quantity = 4;
    bool is_available = 5;
    repeated string suspension_reasons = 6;
}